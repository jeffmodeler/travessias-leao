<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Travessias · mudamos de casa</title>

<meta http-equiv="refresh" content="5;url=https://jeffmodeler.github.io/travessias-leao/">
<link rel="canonical" href="https://jeffmodeler.github.io/travessias-leao/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --creme: #FAF7F2;
    --tinta: #1E2A38;
    --terra: #A84A2A;
    --mel:   #C89B4A;
    --oliva: #5C6B4E;
    --cinza: #8A8578;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: 'Lora', Georgia, serif;
    background: var(--creme);
    color: var(--tinta);
    display: grid;
    place-items: center;
    padding: 32px 24px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }

  .marca {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--cinza);
    margin-bottom: 36px;
  }

  .marca span {
    color: var(--terra);
    font-weight: 500;
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(38px, 8vw, 56px);
    line-height: 1.05;
    letter-spacing: -0.01em;
    color: var(--tinta);
    margin-bottom: 28px;
  }

  .filete {
    width: 48px;
    height: 1px;
    background: var(--mel);
    margin: 0 auto 28px;
  }

  .corpo {
    font-size: 17px;
    line-height: 1.6;
    color: var(--tinta);
    margin-bottom: 36px;
  }

  .corpo em {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    color: var(--terra);
    font-weight: 400;
  }

  .botao {
    display: inline-block;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--creme);
    background: var(--tinta);
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 2px;
    transition: background 200ms ease;
  }

  .botao:hover,
  .botao:focus-visible {
    background: var(--terra);
  }

  .botao:focus-visible {
    outline: 2px solid var(--mel);
    outline-offset: 3px;
  }

  .url-novo {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--cinza);
    margin-top: 14px;
    word-break: break-all;
  }

  .countdown {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--cinza);
    margin-top: 56px;
  }

  .countdown b {
    color: var(--terra);
    font-weight: 500;
  }

  footer {
    margin-top: 14px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--cinza);
  }

  @media (prefers-reduced-motion: reduce) {
    .botao { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="marca">Travessias <span>·</span> cartas de mulheres reais</div>

  <h1>Mudamos de casa.</h1>

  <div class="filete" aria-hidden="true"></div>

  <p class="corpo">
    O eBook continua disponível,<br>
    agora em <em>endereço próprio</em>.
  </p>

  <a class="botao" href="https://jeffmodeler.github.io/travessias-leao/">
    visitar o novo site
  </a>

  <span class="url-novo">jeffmodeler.github.io/travessias-leao</span>

  <p class="countdown" aria-live="polite">
    redirecionando em <b id="t">5</b>s
  </p>

  <footer>Por Renata Leão · 2026</footer>
</main>

<script>
  (function () {
    var destino = 'https://jeffmodeler.github.io/travessias-leao/';
    var n = 5;
    var el = document.getElementById('t');
    var id = setInterval(function () {
      n -= 1;
      if (el) el.textContent = String(Math.max(n, 0));
      if (n <= 0) {
        clearInterval(id);
        window.location.replace(destino);
      }
    }, 1000);
  })();
</script>
</body>
</html>
